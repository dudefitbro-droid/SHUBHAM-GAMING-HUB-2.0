
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SHUBHAM TALKING TOM FRIENDS 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#10152b;color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}
header{
  height:65px;background:#171e3d;
  display:flex;align-items:center;
  justify-content:space-between;padding:0 15px;
  border-bottom:2px solid #ff9b31;
}
header h2{font-size:17px;color:#ffae43}
header span{font-size:12px;color:#a8c6ff}
#game{width:100%;height:calc(100dvh - 220px);min-height:280px}
canvas{display:block}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;padding:10px;
  background:#171e3d;
}
.stat{
  background:#252e50;border-radius:12px;
  padding:9px;text-align:center;font-size:12px;
}
.bar{
  height:8px;background:#424c70;
  border-radius:20px;margin-top:7px;overflow:hidden;
}
.fill{height:100%;width:75%;background:#53e69a;transition:.3s}
.controls{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:8px;padding:10px;
  background:#11172e;
}
button{
  border:0;border-radius:12px;padding:13px 3px;
  background:#ff9b31;color:#24152b;
  font-weight:bold;font-size:13px;
  cursor:pointer;
}
button:active{transform:scale(.94)}
.talk{
  display:flex;gap:7px;padding:8px 10px;
  background:#11172e;
}
input{
  flex:1;min-width:0;border:0;border-radius:10px;
  padding:11px;background:#252e50;color:white;
}
.talk button{padding:10px 15px}
#message{
  position:absolute;top:78px;left:50%;
  transform:translateX(-50%);
  background:#fff;color:#222;
  padding:10px 18px;border-radius:20px;
  font-weight:bold;font-size:14px;
  z-index:5;white-space:nowrap;
}
@media(min-width:700px){
  #game{height:calc(100dvh - 210px)}
  .controls{padding:10px 15%;gap:15px}
  .stats{padding:10px 20%}
  .talk{padding:8px 20%}
}
</style>
</head>
<body>

<header>
  <h2>🐱 SHUBHAM TOM 3D</h2>
  <span>V1.0 • Virtual Pet</span>
</header>

<div id="message">Hello! I am Tom 😺</div>

<div id="game"></div>

<div class="stats">
  <div class="stat">❤️ Happiness
    <div class="bar"><div class="fill" id="happy"></div></div>
  </div>
  <div class="stat">🍕 Hunger
    <div class="bar"><div class="fill" id="hunger"></div></div>
  </div>
  <div class="stat">⚡ Energy
    <div class="bar"><div class="fill" id="energy"></div></div>
  </div>
</div>

<div class="controls">
  <button onclick="feed()">🍕 FEED</button>
  <button onclick="bath()">🛁 BATH</button>
  <button onclick="sleep()">😴 SLEEP</button>
  <button onclick="dance()">💃 DANCE</button>
</div>

<div class="talk">
  <input id="words" placeholder="Say something to Tom...">
  <button onclick="talk()">🎤 TALK</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bdcff);
scene.fog = new THREE.Fog(0x9bdcff,12,30);

const camera = new THREE.PerspectiveCamera(
  45,innerWidth/(innerHeight-220),0.1,100
);
camera.position.set(0,2.5,9);
camera.lookAt(0,1.3,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight-220);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x63749a,2));

const light=new THREE.DirectionalLight(0xffffff,2.5);
light.position.set(4,8,6);
light.castShadow=true;
scene.add(light);

function mat(color){
 return new THREE.MeshStandardMaterial({color,roughness:.7});
}
const orange=mat(0xff922e);
const cream=mat(0xffdfb0);
const pink=mat(0xff7e9e);
const black=mat(0x20202b);
const white=mat(0xffffff);
const green=mat(0x42d99a);

function sphere(parent,x,y,z,sx,sy,sz,material){
 const m=new THREE.Mesh(
  new THREE.SphereGeometry(1,32,24),material
 );
 m.position.set(x,y,z);
 m.scale.set(sx,sy,sz);
 m.castShadow=true;
 parent.add(m);
 return m;
}

function limb(parent,x,y,z,length,material){
 const m=new THREE.Mesh(
  new THREE.CapsuleGeometry(.13,length-.26,5,12),material
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 parent.add(m);
 return m;
}

// Floor
const floor=new THREE.Mesh(
 new THREE.CircleGeometry(8,64),
 mat(0x65cf93)
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.04;
floor.receiveShadow=true;
scene.add(floor);

// House background
const wall=new THREE.Mesh(
 new THREE.BoxGeometry(13,7,.2),
 mat(0xf0d8ff)
);
wall.position.set(0,3,-3);
scene.add(wall);

// Tom group
const tom=new THREE.Group();
scene.add(tom);

// Body – upright humanoid shape
const body=sphere(tom,0,1.25,0,.53,.78,.36,orange);
sphere(tom,0,1.18,.32,.34,.48,.09,cream);

// Head
const head=new THREE.Group();
head.position.set(0,2.38,0);
tom.add(head);

sphere(head,0,0,0,.76,.72,.58,orange);

// Ears
function ear(x,rot){
 const e=new THREE.Mesh(
  new THREE.ConeGeometry(.29,.68,4),orange
 );
 e.position.set(x,.69,0);
 e.rotation.z=rot;
 e.castShadow=true;
 head.add(e);
 const inside=new THREE.Mesh(
  new THREE.ConeGeometry(.16,.39,4),pink
 );
 inside.position.set(x,.70,.15);
 inside.rotation.z=rot;
 head.add(inside);
}
ear(-.48,.42);
ear(.48,-.42);

// Eyes
sphere(head,-.28,.12,.51,.18,.22,.10,white);
sphere(head,.28,.12,.51,.18,.22,.10,white);
sphere(head,-.27,.12,.60,.085,.12,.055,green);
sphere(head,.27,.12,.60,.085,.12,.055,green);
sphere(head,-.27,.12,.65,.045,.08,.03,black);
sphere(head,.27,.12,.65,.045,.08,.03,black);

// Nose and muzzle
sphere(head,0,-.12,.62,.13,.09,.08,pink);
sphere(head,-.13,-.27,.53,.20,.14,.12,cream);
sphere(head,.13,-.27,.53,.20,.14,.12,cream);

// Mouth
const mouth=new THREE.Mesh(
 new THREE.TorusGeometry(.12,.018,8,24,Math.PI),
 black
);
mouth.position.set(0,-.35,.61);
mouth.rotation.z=Math.PI;
head.add(mouth);

// Arms
const leftArm=new THREE.Group();
leftArm.position.set(-.48,1.75,0);
tom.add(leftArm);
limb(leftArm,0,-.35,0,.85,orange);
sphere(leftArm,0,-.78,.02,.18,.17,.16,orange);

const rightArm=new THREE.Group();
rightArm.position.set(.48,1.75,0);
tom.add(rightArm);
limb(rightArm,0,-.35,0,.85,orange);
sphere(rightArm,0,-.78,.02,.18,.17,.16,orange);

// Legs and feet
const leftLeg=new THREE.Group();
leftLeg.position.set(-.25,.62,0);
tom.add(leftLeg);
limb(leftLeg,0,-.27,0,.65,orange);
sphere(leftLeg,0,-.56,.13,.25,.14,.34,cream);

const rightLeg=new THREE.Group();
rightLeg.position.set(.25,.62,0);
tom.add(rightLeg);
limb(rightLeg,0,-.27,0,.65,orange);
sphere(rightLeg,0,-.56,.13,.25,.14,.34,cream);

// Tail
const tailCurve=new THREE.CatmullRomCurve3([
 new THREE.Vector3(0,.9,-.3),
 new THREE.Vector3(.5,.8,-.65),
 new THREE.Vector3(.9,1.2,-.8),
 new THREE.Vector3(1.05,1.5,-.8)
]);
const tail=new THREE.Mesh(
 new THREE.TubeGeometry(tailCurve,32,.09,12,false),orange
);
tom.add(tail);

// Furniture
const table=new THREE.Mesh(
 new THREE.BoxGeometry(2,.15,.8),mat(0x9b633f)
);
table.position.set(-2,.85,-.3);
scene.add(table);

tom.position.y=0;

let happiness=80,hunger=75,energy=80;
let action='idle';
let actionTime=0;
let sleeping=false;

const message=document.getElementById('message');

function say(text){
 message.textContent=text;
}

function updateStats(){
 document.getElementById('happy').style.width=happiness+'%';
 document.getElementById('hunger').style.width=hunger+'%';
 document.getElementById('energy').style.width=energy+'%';
}

window.feed=function(){
 if(hunger>=100){say("I'm already full! 😋");return;}
 hunger=Math.min(100,hunger+20);
 happiness=Math.min(100,happiness+5);
 action='eat';actionTime=2;
 sleeping=false;
 say("Yummy! Thank you! 🍕");
 updateStats();
};

window.bath=function(){
 action='bath';actionTime=3;
 sleeping=false;
 happiness=Math.min(100,happiness+10);
 say("Splash splash! I am clean! 🛁");
 updateStats();
};

window.sleep=function(){
 sleeping=!sleeping;
 action='sleep';actionTime=0;
 say(sleeping?"Good night! 😴":"I am awake! 😺");
};

window.dance=function(){
 if(energy<10){say("I am too tired! 😴");return;}
 action='dance';actionTime=4;
 sleeping=false;
 energy=Math.max(0,energy-10);
 say("Let's dance! 💃");
 updateStats();
};

window.talk=function(){
 const text=document.getElementById('words').value.trim();
 if(!text)return;
 say("You said: "+text);
 action='talk';actionTime=2;
 sleeping=false;
 if('speechSynthesis' in window){
  speechSynthesis.cancel();
  const speech=new SpeechSynthesisUtterance(text);
  speech.pitch=1.8;
  speech.rate=1.1;
  speechSynthesis.speak(speech);
 }
};

renderer.domElement.addEventListener('pointerdown',()=>{
 if(sleeping){sleeping=false;}
 action='happy';actionTime=2;
 happiness=Math.min(100,happiness+5);
 say("Hehe! That tickles! 😂");
 updateStats();
});

let clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 const dt=Math.min(clock.getDelta(),.05);

 if(actionTime>0)actionTime-=dt;
 else if(action!=='idle')action='idle';

 if(!sleeping){
  tom.position.y=Math.sin(t*3)*.045;
  head.rotation.z=Math.sin(t*1.7)*.035;
 }else{
  tom.position.y=-.12;
  head.rotation.z=.15;
 }

 tail.rotation.y=Math.sin(t*3)*.25;

 leftArm.rotation.z=0;
 rightArm.rotation.z=0;
 leftLeg.rotation.x=0;
 rightLeg.rotation.x=0;

 if(action==='dance'){
  leftArm.rotation.z=Math.sin(t*12)*.9;
  rightArm.rotation.z=-Math.sin(t*12)*.9;
  leftLeg.rotation.x=Math.sin(t*12)*.5;
  rightLeg.rotation.x=-Math.sin(t*12)*.5;
  tom.rotation.y=Math.sin(t*6)*.15;
 }
 if(action==='eat'){
  rightArm.rotation.z=-1.3;
  head.rotation.x=.18;
 }
 if(action==='bath'){
  leftArm.rotation.z=Math.sin(t*10)*.7;
  rightArm.rotation.z=-Math.sin(t*10)*.7;
 }
 if(action==='talk'){
  rightArm.rotation.z=-.5;
  head.rotation.y=Math.sin(t*5)*.12;
 }
 if(action==='happy'){
  leftArm.rotation.z=.9;
  rightArm.rotation.z=-.9;
 }
 if(sleeping){
  head.rotation.x=.15;
 }

 renderer.render(scene,camera);
}

animate();
updateStats();

setInterval(()=>{
 if(!sleeping){
  hunger=Math.max(0,hunger-.3);
  energy=Math.max(0,energy-.15);
 }else{
  energy=Math.min(100,energy+2);
 }
 updateStats();
},3000);

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/(innerHeight-220);
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight-220);
});
</script>
</body>
</html>
